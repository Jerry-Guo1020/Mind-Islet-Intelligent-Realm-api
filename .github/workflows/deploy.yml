name: Deploy Healthy Island API

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/healthy-island-api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name
        run: |
          image="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload deploy files
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.ALIYUN_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${{ secrets.ALIYUN_PORT }}" "${{ secrets.ALIYUN_HOST }}" >> ~/.ssh/known_hosts
          tar -czf /tmp/healthy-island-api-deploy.tgz \
            docker-compose.yml \
            deploy/remote-deploy.sh \
            prisma/migrations
          scp -P "${{ secrets.ALIYUN_PORT }}" \
            -i ~/.ssh/deploy_key \
            /tmp/healthy-island-api-deploy.tgz \
            "${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}:/tmp/healthy-island-api-deploy.tgz"

      - name: Deploy on server
        run: |
          ssh -p "${{ secrets.ALIYUN_PORT }}" \
            -i ~/.ssh/deploy_key \
            "${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}" \
            "IMAGE='$IMAGE' GHCR_USER='${{ github.actor }}' GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' bash -s" << 'EOF'
              set -eu
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
              APP_DIR="/root/apps/healthy-island-api"
              mkdir -p "$APP_DIR"
              if [ ! -f "$APP_DIR/.env" ]; then
                echo "missing $APP_DIR/.env" >&2
                exit 1
              fi
              if grep -q '^API_IMAGE=' "$APP_DIR/.env"; then
                sed -i "s|^API_IMAGE=.*|API_IMAGE=$IMAGE|" "$APP_DIR/.env"
              else
                printf '\nAPI_IMAGE=%s\n' "$IMAGE" >> "$APP_DIR/.env"
              fi
              tar -xzf /tmp/healthy-island-api-deploy.tgz -C "$APP_DIR"
              sh "$APP_DIR/deploy/remote-deploy.sh"
          EOF
